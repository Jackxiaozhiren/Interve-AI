name: Visual baselines
# Dispatch-only on purpose. This workflow never writes to the branch: it renders
# the two snapshots on the ubuntu runner and hands them back as an artifact, so a
# human decides what the product is supposed to look like and commits it. An
# auto-committing baseline job is a gate that can be silently re-pointed at the
# defect it just started to tolerate.
#
#   gh workflow run visual-baselines.yml --ref <branch>
#   gh run download <run-id> -n visual-baselines-ubuntu
#   cp ./visual-baselines-ubuntu/* tests/a11y-visual.spec.ts-snapshots/
#
# The committed ubuntu pair is what `npm run test:e2e:visual` compares against in
# CI; a local dev regenerates the darwin pair with `npm run visual:baselines`.
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Mirrors the steps `gate` runs before its visual lane, on purpose: the same
      # install (no `--ignore-scripts`) and a production build. A baseline
      # captured under different preparation does not match the lane that compares
      # against it. Measured: a re-capture without the build produced a snapshot
      # differing from the gate's own render in 6187 pixels, all of them in the nav
      # and heading bands and none in the copy change being blessed. With these two
      # steps the capture and the gate's own render agree exactly: measured 0
      # differing pixels over the 1280x3476 landing snapshot, against 6187 before.
      #
      # S0 (2026-11-17) removed one of the two reasons this had to be exact. The
      # app used to ship no webfont, so every glyph came from whatever the host
      # resolved and the build step was the only thing keeping capture and gate
      # aligned. It now bundles Inter and serves it same-origin, so glyphs are
      # pinned by the repo rather than by the runner — the build step stays because
      # the first half of that reasoning was never about fonts.
      - run: npm ci
      - run: npm run build
      # The local playwright binary, not `npx playwright`: nothing is fetched by
      # version range at run time, and the browser build always matches the
      # pinned @playwright/test in the lockfile.
      - run: npm run e2e:install-browser
      - run: npm run visual:baselines
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-ubuntu
          path: tests/a11y-visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error

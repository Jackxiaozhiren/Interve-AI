name: DSA
on:
  push:
    branches: [main]
    paths: ["apps/dsa-web/**", "services/dsa-api/**", ".github/workflows/dsa.yml"]
  pull_request:
    paths: ["apps/dsa-web/**", "services/dsa-api/**", ".github/workflows/dsa.yml"]

jobs:
  dsa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install web deps
        working-directory: apps/dsa-web
        run: npm ci
      - name: Install API deps
        run: pip install -r services/dsa-api/requirements.txt
      - run: npm --prefix apps/dsa-web run typecheck
      - run: npm --prefix apps/dsa-web run test
      - run: npm --prefix apps/dsa-web run build
      - name: Start API (background)
        run: nohup uvicorn app.main:app --port 8000 --app-dir services/dsa-api > /tmp/dsa-api.log 2>&1 &
      - name: Install Playwright browsers
        working-directory: apps/dsa-web
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke (mock lane, desktop + mobile)
        working-directory: apps/dsa-web
        run: E2E_MOCK=1 npx playwright test --project=chrome-1280x720 --project=mobile-390
        env:
          CI: true
      # The verdict comes from the reachability split, the same rule `audit:deps`
      # applies to the Interve app: a critical in the shipped tree fails with no
      # exception path, and a critical in the developer tree has to be named in
      # `docs/audit/deps-critical-dsa-web.json` in both directions — so an
      # undisclosed one fails and a retired one that nobody deleted fails too.
      # The old step was `npm --prefix apps/dsa-web audit --audit-level=critical`,
      # which folded both trees into one number: a runner-only advisory in vitest
      # blocked a docs-only PR exactly like a deployed one would, and the whole
      # artefact of that red was "Process completed with exit code 1". The raw
      # report still goes to the job summary, because a gate nobody can read is a
      # gate people route around with flags.
      - name: Dependency audit (critical) - apps/dsa-web
        run: |
          set +e
          out="$(npm run audit:deps:dsa 2>&1)"
          code=$?
          raw="$(npm --prefix apps/dsa-web audit 2>&1)"
          printf '%s\n' "$out"
          {
            printf '### apps/dsa-web dependency audit exited %s\n\n' "$code"
            printf '```text\n%s\n```\n\n' "$out"
            printf '<details><summary>raw npm audit report</summary>\n\n'
            printf '```text\n%s\n```\n\n' "$raw"
            printf '</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

# S2-01: CodeQL SAST lane (was OPEN/deferred for multiple periods;
# SAST so far = tsc strict + ESLint only, see SECURITY_REPORT §3).
# Keyless, $0 (GitHub-native). New file only: touches no existing
# workflow (CI-01 adjacent, zero modifications elsewhere).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 03:00 UTC — spreads load vs Dependabot Monday 09:00.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Generous vs the 30 min CI gate: first CodeQL DB build on a
    # Next.js repo can be slow on shared runners; breach = investigate,
    # not a product regression.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

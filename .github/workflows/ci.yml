name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # V11 Ring B: debt ratchet. Cheapest gate in the pipeline (~0.3s), so it
      # runs first — a ceiling breach should fail before a 40s build spends the
      # runner. Ledger lives in docs/audit/facts.limits.json; re-seed with
      # `npm run facts:seed` only as part of a deliberate, reviewed debt cut.
      - run: npm run facts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:eval
        env:
          CI: true
      - run: npm run verify:supabase-free
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
        env:
          CI: true
      # Transfer budgets (P2-02 follow-up): prod server + probe --assert.
      # Budgets live in scripts/perf-probe.mjs (policy + headroom documented
      # there); breach or probe failure fails the gate. Plain probe runs
      # (no --assert) stay print-only for local use.
      - name: perf transfer budgets
        # Ephemeral CI-only signing secret (the throwaway prod server must
        # issue its own probe sessions; dev-fallback is dev-only by design).
        env:
          SESSION_SECRET: perf-smoke-${{ github.run_id }}
        run: |
          (npx next start -p 3100 >/tmp/next-start.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3100/ >/dev/null && break || sleep 2; done
          npm run perf:assert; status=$?
          pkill -f "next start -p 3100" || true
          exit $status
      - run: npm audit --audit-level=critical
      # Phase G2: deploy-surface consistency (Vercel uses `next build` with
      # output:standalone; Docker must ship the same node major + no secrets).
      - name: deploy consistency (vercel.json / standalone / docker / engines)
        run: >
          node -e "
          const fs = require('fs');
          const fail = (m) => { console.error('DEPLOY-DRIFT: ' + m); process.exit(1); };
          if (!fs.readFileSync('next.config.ts', 'utf8').includes(\"output: 'standalone'\"))
            fail('next.config.ts lost output:standalone (Docker + Vercel depend on it)');
          const docker = fs.readFileSync('Dockerfile', 'utf8');
          if (!docker.includes('FROM node:24')) fail('Dockerfile drifted off node:24');
          const engines = JSON.parse(fs.readFileSync('package.json', 'utf8')).engines || {};
          if (!String(engines.node || '').startsWith('24')) fail('package.json engines.node drifted off 24.x');
          if (fs.readFileSync('.dockerignore', 'utf8').split('\n').every((l) => l.trim() !== '.env*'))
            fail('.dockerignore lost the .env* rule (secrets would bake into layers)');
          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (vercel.buildCommand || vercel.outputDirectory || vercel.framework)
            fail('vercel.json overrides build/output — keep default next build for parity');
          console.log('deploy consistency OK (standalone + node24 + no-secret-layers + default vercel build)');
          "

  # FREE-tier live AI smoke (≤3 flash calls). Skips safely when no free Zhipu
  # key is configured (job-level `if:` cannot read `secrets` — it invalidates
  # the whole file — so the key is mapped to env and gated per step).
  # Full 31-call suites stay manual/nightly (see docs/AI_EVALUATION.md).
  free-eval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:eval:free
        if: ${{ env.ZHIPU_API_KEY != '' }}
        env:
          CI: true
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # V11 Ring B: debt ratchet. Cheapest gate in the pipeline (~0.3s), so it
      # runs first — a ceiling breach should fail before a 40s build spends the
      # runner. Ledger lives in docs/audit/facts.limits.json; re-seed with
      # `npm run facts:seed` only as part of a deliberate, reviewed debt cut.
      - run: npm run facts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Every guard here must be able to fail: plant a defect, expect red, restore.
      # A guard that cannot go red is decoration, and CI is where that shows up.
      - run: npm run falsify
      - run: npm run build
      - run: npm run test:eval
        env:
          CI: true
      - run: npm run verify:supabase-free
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Fonts are load-bearing here, not decoration: the two visual baselines
      # were captured on an image carrying fonts-freefont, fonts-unifont and
      # fonts-wqy-zenhei, and without them Chromium's fallback shifts ~13.6k
      # pixels (2%) on the English landing/login pages — above the 400-pixel
      # tolerance. The apt mirror that provides them intermittently fails DNS
      # ("Temporary failure resolving azure.archive.ubuntu.com"), and each
      # attempt used to burn ~2 minutes on that timeout, which is how a job
      # with every test already green got cancelled at 30 minutes.
      #
      # So: download the browser first (no apt), then fetch only the fonts,
      # forcing IPv4 and bounding each attempt to 150s. Two attempts cost at
      # most five minutes. If both fail the step fails with a message naming
      # the mirror, instead of letting the visual lane fail for an unrelated
      # reason and sending the next reader hunting through pixel diffs.
      - name: Install Playwright chromium and font set
        run: |
          npx --no-install playwright install chromium
          # The hosted image routes apt through /etc/apt/apt-mirrors.txt, which
          # points at azure.archive.ubuntu.com. That host's DNS fails on this
          # runner ("Could not resolve"), so editing sources.list.d does
          # nothing — the entry is an indirection, and the package index keeps
          # the old URI until the mirrorlist itself changes and the index is
          # refreshed. The fonts below are architecture-independent, so any
          # Ubuntu mirror serves identical bytes.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "https://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update -o Acquire::ForceIPv4=true \
            -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
            -o Acquire::Retries=0 || true
          for attempt in 1 2; do
            if timeout 180 sudo apt-get -o Acquire::ForceIPv4=true \
                 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 \
                 -o Acquire::Retries=0 install -y --no-install-recommends \
                 fonts-freefont-ttf fonts-unifont fonts-wqy-zenhei; then
              echo "font set installed on attempt ${attempt}"
              exit 0
            fi
            echo "font install attempt ${attempt} failed"
          done
          echo "::error::the visual baselines require fonts-freefont-ttf, fonts-unifont and fonts-wqy-zenhei, and no apt mirror could be reached"
          exit 1
      - run: npm run test:e2e:smoke
        env:
          CI: true

      # axe legs only. The two snapshot tests in the same file have their own
      # lane below, so the axe scan is not gated on a picture matching.
      - run: npm run test:e2e:axe
        env:
          CI: true

      # The visual tier, on the platform this runner is. Baselines are keyed by
      # host platform, so `*-linux.png` lives beside the `*-darwin.png` a local
      # dev regenerates; both are committed and `gh workflow run
      # visual-baselines` refreshes the ubuntu pair. This lane is what catches a
      # copy change that moves pixels — the hero's version badge did exactly that
      # and no other lane noticed.
      - run: npm run test:e2e:visual
        env:
          CI: true

      # Three of this file's four tests: skip-link focus, the insights
      # default-off check, and pause/think-time pressed state. The excluded one
      # needs the mic button to leave its `!modelsReady` disabled state, which a
      # cold runner has never done inside the budget.
      # See docs/TESTING.md "Specs no CI lane collects".
      - run: npm run test:e2e:keyboard
        env:
          CI: true

      # Reproduce the runner-only mock-journey failure with evidence attached.
      - run: npm run test:e2e:mock
        env:
          CI: true
      # Transfer budgets (P2-02 follow-up): prod server + probe --assert.
      # Budgets live in scripts/perf-probe.mjs (policy + headroom documented
      # there); breach or probe failure fails the gate. Plain probe runs
      # (no --assert) stay print-only for local use.
      - name: perf transfer budgets
        # Ephemeral CI-only signing secret (the throwaway prod server must
        # issue its own probe sessions; dev-fallback is dev-only by design).
        env:
          SESSION_SECRET: perf-smoke-${{ github.run_id }}
        run: |
          (npx next start -p 3100 >/tmp/next-start.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3100/ >/dev/null && break || sleep 2; done
          npm run perf:assert; status=$?
          pkill -f "next start -p 3100" || true
          exit $status
      # Dependency surface, split by reachability. `npm audit --audit-level=critical`
      # alone folded the shipped bundle and the developer's test runner into one
      # number, so a critical in vitest's worker pool blocked a docs-only PR exactly
      # like a critical in the deployed code — and on 2026-10-06 it turned every open
      # branch red at once with no code change, because the advisory feed moved.
      # Now: zero criticals in the shipped tree is a hard bar with no exception path;
      # criticals in the developer tree must match docs/audit/deps-critical.json
      # exactly, in both directions. See scripts/audit-deps.mjs.
      - run: npm run audit:deps
      # Phase G2: deploy-surface consistency (Vercel uses `next build` with
      # output:standalone; Docker must ship the same node major + no secrets).
      - name: deploy consistency (vercel.json / standalone / docker / engines)
        run: >
          node -e "
          const fs = require('fs');
          const fail = (m) => { console.error('DEPLOY-DRIFT: ' + m); process.exit(1); };
          if (!fs.readFileSync('next.config.ts', 'utf8').includes(\"output: 'standalone'\"))
            fail('next.config.ts lost output:standalone (Docker + Vercel depend on it)');
          const docker = fs.readFileSync('Dockerfile', 'utf8');
          if (!docker.includes('FROM node:24')) fail('Dockerfile drifted off node:24');
          const engines = JSON.parse(fs.readFileSync('package.json', 'utf8')).engines || {};
          if (!String(engines.node || '').startsWith('24')) fail('package.json engines.node drifted off 24.x');
          if (fs.readFileSync('.dockerignore', 'utf8').split('\n').every((l) => l.trim() !== '.env*'))
            fail('.dockerignore lost the .env* rule (secrets would bake into layers)');
          const vercel = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (vercel.buildCommand || vercel.outputDirectory || vercel.framework)
            fail('vercel.json overrides build/output — keep default next build for parity');
          console.log('deploy consistency OK (standalone + node24 + no-secret-layers + default vercel build)');
          "
      # Runner-only failures are otherwise undebuggable: Playwright writes an
      # accessibility snapshot (error-context.md) and a trace per failure into
      # test-results/, and those die with the runner. Only runs on failure, so a
      # green pipeline uploads nothing.
      - name: upload playwright evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # FREE-tier live AI smoke (≤3 flash calls). Skips safely when no free Zhipu
  # key is configured (job-level `if:` cannot read `secrets` — it invalidates
  # the whole file — so the key is mapped to env and gated per step).
  # Full 31-call suites stay manual/nightly (see docs/AI_EVALUATION.md).
  free-eval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:eval:free
        if: ${{ env.ZHIPU_API_KEY != '' }}
        env:
          CI: true
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

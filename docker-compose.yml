services:
  dsa-api:
    build: ./services/dsa-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  dsa-web:
    image: node:24-slim
    working_dir: /srv/web
    volumes:
      - ./apps/dsa-web:/srv/web
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    command: sh -c "npm ci && npm run dev -- --port 3001 --hostname 0.0.0.0"
    depends_on:
      dsa-api:
        condition: service_healthy
